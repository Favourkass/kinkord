name: CI

on:
  pull_request:
    branches: [dev, main]

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm exec prettier --check .

      - name: Lint (all workspaces)
        run: pnpm run lint

      - name: Typecheck (all workspaces)
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Changed feature files have specs
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-tests.mjs

      - name: Build
        env:
          # next build's type-check worker overflows Node's default ~2GB heap
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm run build
