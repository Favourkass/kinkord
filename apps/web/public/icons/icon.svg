<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA7C11"/>
      <stop offset="100%" stop-color="#5B420B"/>
    </linearGradient>
    <radialGradient id="dark-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Shield/Rounded Box -->
  <rect width="512" height="512" rx="112" fill="url(#dark-bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#gold-grad)" stroke-width="4" stroke-opacity="0.4"/>
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="url(#gold-grad)" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Center Monogram / Keyhole Symbol -->
  <g transform="translate(256, 256)" filter="url(#gold-glow)">
    <!-- Outer Ring -->
    <circle cx="0" cy="-30" r="75" fill="none" stroke="url(#gold-grad)" stroke-width="24"/>
    <!-- Inner Ring Accent -->
    <circle cx="0" cy="-30" r="48" fill="none" stroke="url(#gold-grad)" stroke-width="4" stroke-opacity="0.7"/>
    <!-- Keyhole stem / Diamond Base -->
    <path d="M -26 -10 L 26 -10 L 40 120 L -40 120 Z" fill="url(#gold-grad)"/>
    <!-- Lower Notch -->
    <path d="M -40 120 L 40 120 L 50 140 L -50 140 Z" fill="url(#gold-grad)"/>
    <!-- Diamond Peak -->
    <polygon points="0,175 22,145 -22,145" fill="url(#gold-grad)"/>
  </g>
</svg>
