services:
  postgres:
    image: postgres:17-alpine
    container_name: kinkord-postgres
    environment:
      POSTGRES_USER: kinkord
      POSTGRES_PASSWORD: kinkord
      POSTGRES_DB: kinkord
    ports:
      - "5432:5432"
    volumes:
      - kinkord_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinkord"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: kinkord-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  # Local stand-in for S3 so avatar/cover uploads work without an AWS account.
  minio:
    image: minio/minio:latest
    container_name: kinkord-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # The browser PUTs straight to the presigned URL, so the web origin needs CORS.
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000,http://localhost:3100"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console (minioadmin / minioadmin)
    volumes:
      - kinkord_minio:/data

  # One-shot: waits for MinIO, then creates the media bucket. Exits when done.
  minio-init:
    image: minio/mc:latest
    container_name: kinkord-minio-init
    depends_on:
      - minio
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done &&
             mc mb --ignore-existing local/kinkord-media &&
             echo 'minio ready: bucket kinkord-media'"

volumes:
  kinkord_pg:
  kinkord_minio:
