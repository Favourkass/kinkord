services:
  postgres:
    image: postgres:17-alpine
    container_name: kinkord-postgres
    environment:
      POSTGRES_USER: kinkord
      POSTGRES_PASSWORD: kinkord
      POSTGRES_DB: kinkord
    ports:
      - "5432:5432"
    volumes:
      - kinkord_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinkord"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: kinkord-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  kinkord_pg:
